<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }} - Mock Exam</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">OnlineCourse</span>
        <a href="/admin/" class="btn btn-light">Admin</a>
    </div>
</nav>

<div class="container my-5">

    <h1 class="mb-4">{{ lesson.title }} - Mock Exam</h1>

    <form method="POST" action="{% url 'submit' course.id %}">

        {% csrf_token %}

        {% for question in questions %}

        <div class="card mb-4 shadow-sm">
            <div class="card-body">

                <h5 class="card-title">
                    {{ forloop.counter }}. {{ question.question_text }}
                </h5>

                {% for choice in question.choices.all %}

                <div class="form-check mb-2">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="question_{{ question.id }}"
                        value="{{ choice.id }}"
                        id="choice_{{ choice.id }}"
                        required
                    >

                    <label
                        class="form-check-label"
                        for="choice_{{ choice.id }}"
                    >
                        {{ choice.choice_text }}
                    </label>

                </div>

                {% endfor %}

            </div>
        </div>

        {% endfor %}

        <button type="submit" class="btn btn-success btn-lg">
            Submit Exam
        </button>

    </form>

</div>

</body>
</html>
